<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil Radio</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

button{
  width:90%;
  max-width:400px;
  padding:18px;
  margin:10px;
  border:none;
  border-radius:12px;
  background:#007AFF;
  color:white;
  font-size:20px;
}

audio{
  width:90%;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>📻 Tamil Radio</h1>

<button onclick="playRadio('http://radios.crabdance.com:8002/1')">
Crabdance Tamil
</button>

<audio id="player" controls autoplay></audio>

<script>
function playRadio(url){
  document.getElementById('player').src = url;
}
</script>

</body>
</html>
